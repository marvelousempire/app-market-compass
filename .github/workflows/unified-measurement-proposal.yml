name: Unified Measurement Checks
on:
  pull_request:
    paths:
      - "src/market_compass/**"
      - "tests/**"
      - "contracts/**"
      - "docs/UNIFIED-MARKET-STUDIO-WEAVE.md"
      - ".github/workflows/unified-measurement-proposal.yml"
  push:
    branches:
      - main
      - feat/reconcile-unified-market-studio-20261108

permissions:
  contents: read

jobs:
  source-tests:
    name: Supplemental GitHub-hosted source checks (not commissioning)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          export GIT_TERMINAL_PROMPT=0
          test -n "${GITHUB_TOKEN:-}"
          AUTHED="$(printf '%s' "${GITHUB_SERVER_URL}" | sed -E "s#^(https?)://#\1://oauth2:${GITHUB_TOKEN}@#")/${GITHUB_REPOSITORY}.git"
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            git init .
            git remote add origin "${AUTHED}"
          fi
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install development dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Preserve original and new browser scripts
        run: |
          node --check src/market_compass/web/app.js
          node --check src/market_compass/web/act-v1-shell.js
          node --check src/market_compass/web/research-cassettes.js
          node --check src/market_compass/web/hcck.js
          node --check src/market_compass/web/simulator.js
      - name: Run the entire current-main regression suite, including measurement tests
        run: .venv/bin/python -m pytest -q
      - name: Recheck reconciled scope and authority
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from market_compass.api import app
          routes = {r.path for r in app.routes}
          assert {"/api/operator/status", "/api/analyze", "/api/decision-readiness",
                  "/api/hcck/profiles", "/api/hcck/simulate", "/api/simulate"} <= routes
          html = Path("src/market_compass/web/index.html").read_text()
          for needle in ('id="measurement-studio"', 'id="market-exchange"',
                         'id="actor-spaces"', 'id="decision-gates"',
                         'id="intelthat-panel"', 'id="price-chart"'):
              assert needle in html, needle
          print("Source and route preservation checks passed. Owner Mac not commissioned.")
          PY

# The existing macos-briefcase Verify job remains required and unchanged.
# Passing this supplemental Ubuntu job does not grant merge, Gitea acceptance,
# source authority, FiveMac installation or live browser/user-data proof.
