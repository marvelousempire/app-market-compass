[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-compass"
version = "0.5.0"
description = "Explainable market decision intelligence with paired bull/bear evidence."
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8",
  "fastapi>=0.115",
  "networkx>=3.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[project.scripts]
market-compass = "market_compass.cli:app"
market-compass-app = "market_compass.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_compass = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
